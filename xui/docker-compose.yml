version: "3.8"

services:
  xui:
    image: ${XUI_IMAGE:-ghcr.io/mhsanaei/3x-ui@sha256:34c46ea6d838df981c4760bd1fe442413c2b99bbe4bb49dfa3d1bfb8a8a92496}
    restart: unless-stopped
    volumes:
      - ./xui/data:/etc/x-ui
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      TZ: ${TZ:-Europe/Moscow}
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /etc/x-ui
        exec /app/x-ui
    expose:
      - "${PANEL_PORT:-2053}"
      - "${SUB_PORT:-2080}"
      - "${WS_PORT:-3001}"
      - "${XHTTP_PORT:-3003}"
      - "${TROJAN_PORT:-3002}"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
    name: proxy-net
