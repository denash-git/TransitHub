version: "3.8"

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - xui
      - conv
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/config/stream.conf:/etc/nginx/stream.conf:ro
      - ./nginx/config/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/extensions:/etc/nginx/extensions:ro
      - ./web/client_page:/srv/subpage:ro
      - ./web/fake_site:/srv/fakesite:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      proxy-net:
      mtproxy-loop-net:
        ipv4_address: ${MTPROXY_LOOP_NGINX_IP:-172.29.100.10}

networks:
  proxy-net:
    external: true
    name: proxy-net
  mtproxy-loop-net:
    external: true
    name: ${MTPROXY_LOOP_NETWORK:-mtproxy-loop-net}
