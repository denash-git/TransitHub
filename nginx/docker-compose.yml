version: "3.8"

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    restart: unless-stopped
    depends_on:
      - xui
      - conv
      - diag
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/config/stream.conf:/etc/nginx/stream.conf:ro
      - ./nginx/config/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/extensions:/etc/nginx/extensions:ro
      - ./web/client_page:/srv/subpage:ro
      - ./web/fake_site:/srv/fakesite:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      proxy-net:
      tgproxy-loop-net:
        ipv4_address: ${TGPROXY_LOOP_NGINX_IP:-10.251.79.10}

networks:
  proxy-net:
    external: true
    name: proxy-net
  tgproxy-loop-net:
    external: true
    name: ${TGPROXY_LOOP_NETWORK:-tgproxy-loop-net}
