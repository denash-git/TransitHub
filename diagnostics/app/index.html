<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransitHub Diagnostics</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="theme-dark">
  <main class="screen">
    <div class="waves-header" aria-hidden="true">
      <div class="waves-inner-header"></div>
      <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
        viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
          <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
        </defs>
        <g class="parallax">
          <use xlink:href="#gentle-wave" x="48" y="0" />
          <use xlink:href="#gentle-wave" x="48" y="3" />
          <use xlink:href="#gentle-wave" x="48" y="5" />
          <use xlink:href="#gentle-wave" x="48" y="7" />
        </g>
      </svg>
    </div>

    <header class="screen-topbar">
      <div class="brand-mark">TransitHub</div>
      <div class="expires-box">
        <span class="expires-label">Expires URL</span>
        <span class="expires-value"><span id="expires-seconds">--</span> s</span>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        <span id="theme-icon" class="theme-icon" aria-hidden="true">☀</span>
      </button>
    </header>

    <section class="panel-wrap">
      <article class="speed-panel">
        <div class="panel-body">
          <p class="panel-kicker">Diagnostics</p>
          <p id="status-line" class="status-line">Ready to start HTTPS browser test.</p>

          <section class="metrics-strip" aria-label="Current measurements">
            <article class="metric-column">
              <span class="metric-name">Download</span>
              <div class="metric-reading">
                <span id="download-value" class="metric-value">--</span>
                <span class="metric-unit">Mbps</span>
              </div>
            </article>

            <article class="metric-column">
              <span class="metric-name">Upload</span>
              <div class="metric-reading">
                <span id="upload-value" class="metric-value">--</span>
                <span class="metric-unit">Mbps</span>
              </div>
            </article>

            <article class="metric-column">
              <span class="metric-name">Ping</span>
              <div class="metric-reading">
                <span id="ping-value" class="metric-value">--</span>
                <span class="metric-unit">ms</span>
              </div>
            </article>
          </section>

          <section class="progress-block" aria-label="Run progress">
            <div class="progress-track">
              <span id="progress-fill" class="progress-fill"></span>
            </div>
          </section>

          <div class="action-row">
            <button id="start-test" class="start-button" type="button">Start</button>
          </div>
        </div>
      </article>
    </section>
  </main>
  <script src="./assets/app.js"></script>
</body>
</html>
