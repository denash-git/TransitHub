version: "3.8"

services:
  tgproxy:
    image: ${TGPROXY_IMAGE:-nineseconds/mtg@sha256:32e3b3e75ff1931c7b7a3d63557f0a1dd1f7963c08c97bacfa28f3267827ce0f}
    restart: unless-stopped
    volumes:
      - ./tgproxy/config.toml:/config.toml:ro
    expose:
      - "${TGPROXY_PORT:-3128}"
    networks:
      proxy-net:
      tgproxy-loop-net:
        ipv4_address: ${TGPROXY_LOOP_TGPROXY_IP:-10.251.79.11}

networks:
  proxy-net:
    external: true
    name: proxy-net
  tgproxy-loop-net:
    external: true
    name: ${TGPROXY_LOOP_NETWORK:-tgproxy-loop-net}
