version: "3.8"

services:
  mtproxy:
    image: ${MTPROXY_IMAGE:-mtproxy:local}
    build:
      context: ./mtproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MTPROXY_SECRET: ${MTPROXY_SECRET:-}
      MTPROXY_TLS_DOMAIN: ${MTPROXY_TLS_DOMAIN:-}
      MTPROXY_TAG: ${MTPROXY_TAG:-}
      MTPROXY_PORT: ${MTPROXY_PORT:-3443}
      MTPROXY_STATS_PORT: ${MTPROXY_STATS_PORT:-2398}
      MTPROXY_WORKERS: ${MTPROXY_WORKERS:-1}
    extra_hosts:
      - "${MTPROXY_TLS_DOMAIN}:${MTPROXY_LOOP_NGINX_IP:-172.29.100.10}"
    volumes:
      - ./mtproxy/data:/data
    expose:
      - "${MTPROXY_PORT:-3443}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x mtproto-proxy >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      proxy-net:
      mtproxy-loop-net:
        ipv4_address: ${MTPROXY_LOOP_MTPROXY_IP:-172.29.100.11}

networks:
  proxy-net:
    external: true
    name: proxy-net
  mtproxy-loop-net:
    external: true
    name: ${MTPROXY_LOOP_NETWORK:-mtproxy-loop-net}
